name: Scheduler checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime environment
        run: ./scripts/build.sh
      - name: Run tests and supplied baseline in Docker
        run: ./scripts/run_tests.sh -m 'baseline or not baseline'
      - name: Verify Docker lifecycle and offline execution
        run: ./scripts/run_tests.sh --smoke
      - name: Upload schedules generated from the supplied 20-product input
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduler-output
          path: output/
          if-no-files-found: error
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduler-diagnostics
          include-hidden-files: true
          path: |
            .logs/
            .cache/coverage.xml
