name: Skeleton checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime environment
        run: ./scripts/build.sh
      - name: Run tests in Docker
        run: ./scripts/run_tests.sh
      - name: Inspect supplied input
        run: >-
          ./scripts/run.sh inspect
          --input test/data/filling_only_20_product_assignment_input.json
          --report output/inspection.json --debug
      - name: Verify Docker lifecycle and offline execution
        run: ./scripts/run_tests.sh --smoke
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skeleton-diagnostics
          include-hidden-files: true
          path: |
            .logs/
            .cache/coverage.xml
            output/
